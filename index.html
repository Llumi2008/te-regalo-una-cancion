<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancionero del Coro</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      padding: 2rem;
      border: 1px solid #e2e8f0;
    }
    h1 { margin-top: 0; font-size: 1.75rem; color: #0f172a; }
    .badge {
      display: inline-block;
      background-color: #e0f2fe;
      color: #0369a1;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }
    .section {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      background-color: #2563eb;
      color: white;
      padding: 0.75rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      box-sizing: border-box;
      margin-top: 0.5rem;
    }
    .btn:hover { background-color: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cancionero del Coro</h1>
    <div class="badge">Versión Actual: v1.0.0</div>

    <div class="section">
      <h3>Visor de Cancionero</h3>
      <p>Abre o descarga el PDF de la versión vigente.</p>
      <!-- En la siguiente etapa mejoraremos la integración de este visor -->
      <a href="./cancionero.pdf" class="btn" target="_blank">Ver PDF de la versión v1.0.0</a>
    </div>

    <div class="section">
      <h3>Historial y Cambios</h3>
      <p>Consulta las versiones anteriores y el registro de modificaciones en GitHub.</p>
      <a href="https://github.com/Llumi2008/cancionero-coro/releases" class="btn" style="background-color: #475569;" target="_blank">Ver Historial en GitHub</a>
    </div>
  </div>
</body>
</html>
